name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (33et)
on:
  push:
    branches: [main]
    paths:
      - 'knowledge-33et-parts/**'
concurrency:
  group: assemble-knowledge-33et
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        run: |
          test -f knowledge-33et-parts/k01
          test -f knowledge-33et-parts/k08
          cat knowledge-33et-parts/k01 knowledge-33et-parts/k02 knowledge-33et-parts/k03 knowledge-33et-parts/k04 knowledge-33et-parts/k05 knowledge-33et-parts/k06 knowledge-33et-parts/k07 knowledge-33et-parts/k08 > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test "$(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md)" -eq 753980
          echo "5c920e34280789e062e2c894d879fe46  knowledge/everyday-chem-survey/KNOWLEDGE.md" | md5sum -c -
      - name: Commit and clean
        run: |
          git config user.name "survey-assembly"
          git config user.email "survey-assembly@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          if git diff --staged --quiet; then echo "no changes"; else
            git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33et, byte-gated 753980 B / 5c920e34280789e062e2c894d879fe46)"
          fi
          git rm -r -q knowledge-33et-parts
          if git diff --staged --quiet; then echo "no parts to remove"; else
            git commit -m "Remove knowledge-33et-parts (batch 33et)"
          fi
          git push
