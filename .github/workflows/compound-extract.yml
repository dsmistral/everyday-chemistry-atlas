name: compound-extract
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          if [ -f register-parts/HOLD ]; then
            echo "HOLD staged — skip"
            exit 0
          fi
          if [ ! -f register-parts/extract.sh ]; then
            echo "no register-parts staged — skip"
            exit 0
          fi
          if [ -f COMPOUND-REGISTER.md ] && [ ! -f register-parts/MARKER ]; then
            echo "register already built and parts cleaned — skip"
            exit 0
          fi
          bash register-parts/extract.sh
