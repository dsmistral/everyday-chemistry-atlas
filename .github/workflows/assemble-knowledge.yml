name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33ec)
on:
  push:
    paths:
      - 'knowledge-parts/**'
concurrency:
  group: assemble-knowledge-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and commit
        run: |
          for f in knowledge-parts/p1 knowledge-parts/p2 knowledge-parts/p3 knowledge-parts/p4 knowledge-parts/p5 knowledge-parts/p6 knowledge-parts/p7; do
            if [ ! -f "$f" ]; then exit 0; fi
          done
          cat knowledge-parts/p1 knowledge-parts/p2 knowledge-parts/p3 knowledge-parts/p4 knowledge-parts/p5 knowledge-parts/p6 knowledge-parts/p7 > knowledge/everyday-chem-survey/KNOWLEDGE.md
          [ "$(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md)" -eq 725237 ] || { echo SIZE-MISMATCH; exit 1; }
          printf '%s  %s\n' '382bb1a854c1b95d745b3032744db4a9' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33ec)"
          git push origin HEAD:main
          git rm -r knowledge-parts
          git commit -m "Remove knowledge-parts (batch 33ec)"
          git pull --rebase origin main
          git push origin HEAD:main
