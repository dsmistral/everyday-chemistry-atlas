name: assemble-knowledge-33du
on:
  push:
    branches: [main]
    paths:
      - 'knowledge-parts/**'
concurrency:
  group: assemble-knowledge-33du
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md
        run: |
          set -e
          for p in knowledge-parts/p1 knowledge-parts/p2 knowledge-parts/p3 knowledge-parts/p4 knowledge-parts/p5 knowledge-parts/p6 knowledge-parts/p7; do
            if [ ! -f "$p" ]; then echo "waiting: $p absent"; exit 0; fi
          done
          cat knowledge-parts/p1 knowledge-parts/p2 knowledge-parts/p3 knowledge-parts/p4 knowledge-parts/p5 knowledge-parts/p6 knowledge-parts/p7 > knowledge/everyday-chem-survey/KNOWLEDGE.md
          echo "assembled: $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) bytes"
          [ "$(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md)" = "691521" ] || { echo "SIZE MISMATCH"; exit 1; }
          printf '%s  %s\n' "73fe8e1fc4b559879a643087f907a7a4" "knowledge/everyday-chem-survey/KNOWLEDGE.md" > /tmp/knowledge.md5
          md5sum -c /tmp/knowledge.md5 || { echo "MD5 MISMATCH"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git rm -r -q knowledge-parts
          git commit -m "batch-33du: KNOWLEDGE — the 33du addendum (the listing-catch pairs batch + the filmot wall + the Glasp route debut), Corpus 461 -> 465"
          git push
