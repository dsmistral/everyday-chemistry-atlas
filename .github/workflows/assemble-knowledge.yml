name: Assemble KNOWLEDGE (batch 33ea)
on:
  push:
    paths:
      - 'knowledge-parts/**'
concurrency:
  group: assemble-knowledge-33ea
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all parts present
        run: |
          ok=1
          if [ ! -f "knowledge-parts/p1" ]; then
            echo "missing knowledge-parts/p1"
            ok=0
          fi
          if [ ! -f "knowledge-parts/p2" ]; then
            echo "missing knowledge-parts/p2"
            ok=0
          fi
          if [ ! -f "knowledge-parts/p3" ]; then
            echo "missing knowledge-parts/p3"
            ok=0
          fi
          if [ ! -f "knowledge-parts/p4" ]; then
            echo "missing knowledge-parts/p4"
            ok=0
          fi
          if [ ! -f "knowledge-parts/p5" ]; then
            echo "missing knowledge-parts/p5"
            ok=0
          fi
          if [ ! -f "knowledge-parts/p6" ]; then
            echo "missing knowledge-parts/p6"
            ok=0
          fi
          if [ ! -f "knowledge-parts/p7" ]; then
            echo "missing knowledge-parts/p7"
            ok=0
          fi
          if [ "$ok" -eq 0 ]; then
            exit 0
          fi
      - name: Assemble and verify
        run: |
          cat knowledge-parts/p1 knowledge-parts/p2 knowledge-parts/p3 knowledge-parts/p4 knowledge-parts/p5 knowledge-parts/p6 knowledge-parts/p7 > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test "$(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md)" -eq 714997
          printf '%s  %s\n' 'e8736b7378846ef8a70f5b9a0aa0464f' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
      - name: Commit and clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33ea)"
          git push
          git rm -r knowledge-parts
          git commit -m "Remove knowledge-parts (batch 33ea)"
          git push
