name: assemble-knowledge
on:
  push:
    paths:
      - 'knowledge-parts/**'
concurrency:
  group: assemble-knowledge
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          ok=1
          for f in knowledge-parts/p1 knowledge-parts/p2 knowledge-parts/p3 knowledge-parts/p4 knowledge-parts/p5 knowledge-parts/p6 knowledge-parts/p7; do
            [ -f "$f" ] || ok=0
          done
          if [ "$ok" -eq 0 ]; then echo "parts incomplete; exiting"; exit 0; fi
      - name: assemble
        run: |
          cat knowledge-parts/p1 knowledge-parts/p2 knowledge-parts/p3 knowledge-parts/p4 knowledge-parts/p5 knowledge-parts/p6 knowledge-parts/p7 > knowledge/everyday-chem-survey/KNOWLEDGE.md
          wc -c knowledge/everyday-chem-survey/KNOWLEDGE.md
          test "$(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md)" -eq 702164
          printf '%s  %s\n' 'fbf74b41af8d75d2bf8dee05c3918f5f' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "batch-33dx: KNOWLEDGE assembly — the 33dx addendum (the ID-pinned pair; 702164 B, md5 fbf74b41af8d75d2bf8dee05c3918f5f)"
          git push
          git rm -r knowledge-parts
          git commit -m "assemble-knowledge: remove the parts dir (assembled)"
          git push
