name: Assemble papers/CORPUS.md (batch 33eo)
on:
  push:
    paths:
      - 'corpus-33eo-parts/**'
concurrency:
  group: assemble-corpus-33eo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls corpus-33eo-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat corpus-33eo-parts/* > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1155075
          printf '%s  %s\n' 'aa0c705befe4528c4426ab08909062c6' 'papers/CORPUS.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33eo)"
          git push
          git rm -r corpus-33eo-parts
          git commit -m "Remove corpus-33eo-parts (batch 33eo)"
          git push
