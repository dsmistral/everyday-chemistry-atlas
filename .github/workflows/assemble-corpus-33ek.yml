name: Assemble papers/CORPUS.md (batch 33ek)
on:
  push:
    paths:
      - 'corpus-33ek-parts/**'
concurrency:
  group: assemble-corpus-33ek
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls corpus-33ek-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat corpus-33ek-parts/* > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1126932
          printf '%s  %s\n' '39512986bf42a917832f0f3fc9b67840' 'papers/CORPUS.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33ek)"
          git push
          git rm -r corpus-33ek-parts
          git commit -m "Remove corpus-33ek-parts (batch 33ek)"
          git push
