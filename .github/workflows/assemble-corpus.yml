name: Assemble CORPUS
on:
  push:
    branches:
      - main
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-33dq
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All parts present
        run: |
          if [ ! -f corpus-parts/p1 ] || [ ! -f corpus-parts/p2 ]; then
            echo "corpus-parts incomplete - skipping"
            exit 0
          fi
      - name: Assemble and assert
        run: |
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          SIZE=$(wc -c < papers/CORPUS.md)
          if [ "$SIZE" != "962770" ]; then
            echo "BYTE COUNT MISMATCH: $SIZE != 962770"
            exit 1
          fi
          echo "2157b0454c0b7da140b204aef9d08fb8  papers/CORPUS.md" > /tmp/corpus-check.md5
          md5sum -c /tmp/corpus-check.md5
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CORPUS.md
          git rm -r -f corpus-parts
          git commit -m "batch-33dq: CORPUS — the N449 row (the HTME source debut) + the S02-row note (the deletion-axis refinements + the channel-grid maps), Corpus 447 -> 448"
          git push
