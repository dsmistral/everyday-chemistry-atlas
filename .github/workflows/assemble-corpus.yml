name: Assemble papers/CORPUS.md (batch 33eb)
on:
  push:
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-33eb
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check parts
        run: |
          ok=1
          for f in corpus-parts/p1 corpus-parts/p2; do
            if [ ! -f "$f" ]; then ok=0; fi
          done
          if [ "$ok" -eq 0 ]; then echo "parts missing, exiting"; exit 0; fi
      - name: Assemble
        run: |
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          test "$(wc -c < papers/CORPUS.md)" -eq 1087261
          printf '%s  %s\n' 'c7ba30e1f2fb5661dac0c6724c0a03e2' 'papers/CORPUS.md' | md5sum -c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33eb)"
          git push
          git rm -r corpus-parts
          git commit -m "Remove corpus-parts (batch 33eb)"
          git push
