name: assemble-corpus-33du
on:
  push:
    branches: [main]
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-33du
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble papers/CORPUS.md
        run: |
          set -e
          for p in corpus-parts/p1 corpus-parts/p2; do
            if [ ! -f "$p" ]; then echo "waiting: $p absent"; exit 0; fi
          done
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          echo "assembled: $(wc -c < papers/CORPUS.md) bytes"
          [ "$(wc -c < papers/CORPUS.md)" = "1017304" ] || { echo "SIZE MISMATCH"; exit 1; }
          printf '%s  %s\n' "535b4217d794852466737e960451170c" "papers/CORPUS.md" > /tmp/corpus.md5
          md5sum -c /tmp/corpus.md5 || { echo "MD5 MISMATCH"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CORPUS.md
          git rm -r -q corpus-parts
          git commit -m "batch-33du: CORPUS — the N463-N466 rows (the listing-catch pairs: the benzaldehyde pair + the soap part-3 + the OTC doctrine paper) + the S02-cell note (the queue-pressure resolution + the cinnabar adjudication + the Red-P pin + the filmot wall), Corpus 461 -> 465"
          git push
