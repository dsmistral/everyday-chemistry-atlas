name: assemble-corpus
on:
  push:
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          ok=1
          for f in corpus-parts/p1 corpus-parts/p2; do
            [ -f "$f" ] || ok=0
          done
          if [ "$ok" -eq 0 ]; then echo "parts incomplete; exiting"; exit 0; fi
      - name: assemble
        run: |
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          wc -c papers/CORPUS.md
          test "$(wc -c < papers/CORPUS.md)" -eq 1033308
          printf '%s  %s\n' '864416c1c31eebfc20b3c08ac8ca3307' 'papers/CORPUS.md' | md5sum -c
      - name: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/CORPUS.md
          git commit -m "batch-33dx: CORPUS assembly — the N467/N468 rows (the ID-pinned pair: the Lithium Peroxide + the Silver Nitrate) + the line-8 cell note (the 33dw queue resolution discharged), Corpus 465 -> 467; 1033308 B, md5 864416c1c31eebfc20b3c08ac8ca3307"
          git push
          git rm -r corpus-parts
          git commit -m "assemble-corpus: remove the parts dir (assembled)"
          git push
