name: Assemble CORPUS (batch 33dp)
on:
  push:
    branches: [main]
    paths: ['corpus-parts/**', 'corpus-parts']
concurrency:
  group: assemble-corpus-33dp
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check all parts present
        run: |
          if [ ! -f corpus-parts/p1 ] || [ ! -f corpus-parts/p2 ]; then
            echo "parts incomplete, skipping"
            exit 0
          fi
      - name: Assemble and assert
        run: |
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          if [ "$(wc -c < papers/CORPUS.md)" != "954372" ]; then echo "SIZE ASSERT FAILED"; exit 1; fi
          echo "d1c044c3592d509d2d250a9a6bf1ac7b  papers/CORPUS.md" | md5sum -c - || { echo "MD5 ASSERT FAILED"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CORPUS.md
          git rm -r corpus-parts
          git commit -m "batch-33dp: CORPUS — the N438-N448 rows + the S02-row note (the deleted-episode cluster), Corpus 436 -> 447"
          git push
