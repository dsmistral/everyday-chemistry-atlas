name: Assemble CORPUS (batch 33ea)
on:
  push:
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-33ea
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all parts present
        run: |
          ok=1
          if [ ! -f "corpus-parts/p1" ]; then
            echo "missing corpus-parts/p1"
            ok=0
          fi
          if [ ! -f "corpus-parts/p2" ]; then
            echo "missing corpus-parts/p2"
            ok=0
          fi
          if [ "$ok" -eq 0 ]; then
            exit 0
          fi
      - name: Assemble and verify
        run: |
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          test "$(wc -c < papers/CORPUS.md)" -eq 1074463
          printf '%s  %s\n' 'd595f8928500df022db23d21e3be173c' 'papers/CORPUS.md' | md5sum -c
      - name: Commit and clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33ea)"
          git push
          git rm -r corpus-parts
          git commit -m "Remove corpus-parts (batch 33ea)"
          git push
