name: assemble-corpus-33dt
on:
  push:
    branches: [main]
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-33dt
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble papers/CORPUS.md
        run: |
          set -e
          for p in corpus-parts/p1 corpus-parts/p2; do
            if [ ! -f "$p" ]; then echo "waiting: $p absent"; exit 0; fi
          done
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          echo "assembled: $(wc -c < papers/CORPUS.md) bytes"
          [ "$(wc -c < papers/CORPUS.md)" = "1011536" ] || { echo "SIZE MISMATCH"; exit 1; }
          printf '%s  %s\n' "e754c46dc24f9102a964db92bb9e14a0" "papers/CORPUS.md" > /tmp/corpus.md5
          md5sum -c /tmp/corpus.md5 || { echo "MD5 MISMATCH"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CORPUS.md
          git rm -r -q corpus-parts
          git commit -m "batch-33dt: CORPUS — the N461-N462 rows (the 2014 aspirin priors, the redo-axis ancestors) + the S02-cell note (the DDT ID pin + the re-check discharges), Corpus 459 -> 461"
          git push
