name: Assemble papers/CORPUS.md (batch 33ec)
on:
  push:
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and commit
        run: |
          for f in corpus-parts/p1 corpus-parts/p2; do
            if [ ! -f "$f" ]; then exit 0; fi
          done
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          [ "$(wc -c < papers/CORPUS.md)" -eq 1091205 ] || { echo SIZE-MISMATCH; exit 1; }
          printf '%s  %s\n' '6b1eceef9bb7963d3bfb8a2c77ac118c' 'papers/CORPUS.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33ec)"
          git push origin HEAD:main
          git rm -r corpus-parts
          git commit -m "Remove corpus-parts (batch 33ec)"
          git pull --rebase origin main
          git push origin HEAD:main
