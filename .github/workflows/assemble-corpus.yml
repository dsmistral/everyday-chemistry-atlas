name: assemble-corpus-33ds
on:
  push:
    branches: [main]
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-33ds
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble papers/CORPUS.md
        run: |
          set -e
          for p in corpus-parts/p1 corpus-parts/p2; do
            if [ ! -f "$p" ]; then echo "waiting: $p absent"; exit 0; fi
          done
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          echo "assembled: $(wc -c < papers/CORPUS.md) bytes"
          [ "$(wc -c < papers/CORPUS.md)" = "1002220" ] || { echo "SIZE MISMATCH"; exit 1; }
          printf '%s  %s\n' "76d49b4ddf37115e419e85b0f662d4fb" "papers/CORPUS.md" > /tmp/corpus.md5
          md5sum -c /tmp/corpus.md5 || { echo "MD5 MISMATCH"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CORPUS.md
          git rm -r -q corpus-parts
          git commit -m "batch-33ds: CORPUS — the N456-N460 rows (the bonus-pin five: the register's first private-video class + the OrgSyn/wikiHow credit firsts + the mercury self-correction chain) + the S02-cell note, Corpus 454 -> 459"
          git push
