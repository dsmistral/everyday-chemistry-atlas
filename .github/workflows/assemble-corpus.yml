name: Assemble CORPUS (33dr)
on:
  push:
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-33dr
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: All parts present
        run: |
          if [ ! -f corpus-parts/p1 ] || [ ! -f corpus-parts/p2 ]; then echo "corpus-parts incomplete - nothing to assemble"; exit 0; fi
      - name: Assemble and assert
        run: |
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          echo "4eda8bdf6f9f9e7c7710cb5d6dc35f1c  papers/CORPUS.md" | md5sum -c -
          [ "$(wc -c < papers/CORPUS.md)" = "979501" ] || { echo "wc -c mismatch"; exit 1; }
      - name: Commit and clean parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/CORPUS.md
          git rm -r corpus-parts
          git commit -m "batch-33dr: CORPUS - the N450-N455 rows (the Aspirin-to-Acetaminophen series) + the S02-row note + the count, Corpus 448 -> 454"
          git push
