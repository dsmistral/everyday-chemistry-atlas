name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33eo)
on:
  push:
    paths:
      - 'knowledge-33eo-parts/**'
concurrency:
  group: assemble-knowledge-33eo
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls knowledge-33eo-parts | wc -l)
          if [ "$N" -ne 7 ]; then exit 0; fi
          cat knowledge-33eo-parts/* > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) -eq 748402
          printf '%s  %s\n' '78a32d096060f55243848cb918da71f2' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33eo)"
          git push
          git rm -r knowledge-33eo-parts
          git commit -m "Remove knowledge-33eo-parts (batch 33eo)"
          git push
