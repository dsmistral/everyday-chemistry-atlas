name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33ek)
on:
  push:
    paths:
      - 'knowledge-33ek-parts/**'
concurrency:
  group: assemble-knowledge-33ek
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls knowledge-33ek-parts | wc -l)
          if [ "$N" -ne 7 ]; then exit 0; fi
          cat knowledge-33ek-parts/* > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) -eq 742353
          printf '%s  %s\n' 'b23c1ef27b5886b2b55fad1bec72809d' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33ek)"
          git push
          git rm -r knowledge-33ek-parts
          git commit -m "Remove knowledge-33ek-parts (batch 33ek)"
          git push
