name: Assemble papers/STATE.md (batch 33es)
on:
  push:
    paths:
      - 'state-33es-parts/**'
concurrency:
  group: assemble-state-33es
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls state-33es-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat state-33es-parts/* > papers/STATE.md
          test $(wc -c < papers/STATE.md) -eq 1015728
          printf '%s  %s\n' 'b969caf3ca5a8546a1275926d72e9dbb' 'papers/STATE.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33es)"
          git push
          git rm -r state-33es-parts
          git commit -m "Remove state-33es-parts (batch 33es)"
          git push
