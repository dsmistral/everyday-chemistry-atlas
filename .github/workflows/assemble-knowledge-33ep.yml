name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33ep)
on:
  push:
    paths:
      - 'knowledge-33ep-parts/**'
concurrency:
  group: assemble-knowledge-33ep
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls knowledge-33ep-parts | wc -l)
          if [ "$N" -ne 7 ]; then exit 0; fi
          cat knowledge-33ep-parts/* > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) -eq 749294
          printf '%s  %s\n' 'b010b69701b305d75cc43671e0001af7' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33ep)"
          git push
          git rm -r knowledge-33ep-parts
          git commit -m "Remove knowledge-33ep-parts (batch 33ep)"
          git push
