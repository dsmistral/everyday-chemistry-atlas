name: Assemble papers/CORPUS.md (batch 33eh)
on:
  push:
    paths:
      - 'corpus-33eh-parts/**'
concurrency:
  group: assemble-corpus-33eh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          n=$(ls corpus-33eh-parts/p1.part corpus-33eh-parts/p2.part 2>/dev/null | wc -l)
          if [ "$n" -ne 2 ]; then echo "incomplete"; exit 0; fi
      - name: assemble
        run: |
          cat corpus-33eh-parts/p1.part corpus-33eh-parts/p2.part > papers/CORPUS.md
          test "$(wc -c < papers/CORPUS.md)" -eq "1123146"
          printf '%s  %s\n' 'c4976821e8a90b661f2bbbf2f1c588b9' 'papers/CORPUS.md' | md5sum -c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/CORPUS.md
          git commit -m 'Assemble papers/CORPUS.md (batch 33eh)'
          git push
          git rm -r corpus-33eh-parts
          git commit -m 'Remove corpus-33eh-parts (batch 33eh)'
          git push
