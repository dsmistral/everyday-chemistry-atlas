name: Assemble papers/CORPUS.md (batch 33ep)
on:
  push:
    paths:
      - 'corpus-33ep-parts/**'
concurrency:
  group: assemble-corpus-33ep
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls corpus-33ep-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat corpus-33ep-parts/* > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1191134
          printf '%s  %s\n' '0a9fc3dacc11a7013c7b3ec416654db6' 'papers/CORPUS.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33ep)"
          git push
          git rm -r corpus-33ep-parts
          git commit -m "Remove corpus-33ep-parts (batch 33ep)"
          git push
