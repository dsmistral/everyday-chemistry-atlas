name: Assemble papers/CORPUS.md (batch 33ei)
on:
  push:
    paths:
      - 'corpus-33ei-parts/**'
concurrency:
  group: corpus-33ei-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          N=$(ls corpus-33ei-parts | wc -l)
          if [ "$N" -ne 2 ]; then echo "parts incomplete: $N"; exit 0; fi
          cat corpus-33ei-parts/p1.txt corpus-33ei-parts/p2.txt > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1124475
          printf '%s  %s\n' '64a8db93b8b52ec112582bc420a5e7cf' 'papers/CORPUS.md' | md5sum -c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33ei)"
          git push
          git rm -r corpus-33ei-parts
          git commit -m "Remove corpus-33ei-parts (batch 33ei)"
          git push
