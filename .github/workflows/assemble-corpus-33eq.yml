name: Assemble papers/CORPUS.md (batch 33eq)
on:
  push:
    paths:
      - 'corpus-33eq-parts/**'
concurrency:
  group: assemble-corpus-33eq
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls corpus-33eq-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat corpus-33eq-parts/* > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1199311
          printf '%s  %s\n' '05e56a56dab9cc10e82bf5c3467bbde1' 'papers/CORPUS.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33eq)"
          git push
          git rm -r corpus-33eq-parts
          git commit -m "Remove corpus-33eq-parts (batch 33eq)"
          git push
