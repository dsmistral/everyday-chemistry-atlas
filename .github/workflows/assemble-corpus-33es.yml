name: Assemble papers/CORPUS.md (batch 33es)
on:
  push:
    paths:
      - 'corpus-33es-parts/**'
concurrency:
  group: assemble-corpus-33es
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls corpus-33es-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat corpus-33es-parts/* > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1219361
          printf '%s  %s\n' '356a8dadf698c66fac66f1fd607670a9' 'papers/CORPUS.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33es)"
          git push
          git rm -r corpus-33es-parts
          git commit -m "Remove corpus-33es-parts (batch 33es)"
          git push
