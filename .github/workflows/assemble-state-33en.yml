name: Assemble papers/STATE.md (batch 33en)
on:
  push:
    paths:
      - 'state-33en-parts/**'
concurrency:
  group: assemble-state-33en
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          N=$(ls state-33en-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat state-33en-parts/* > papers/STATE.md
          test $(wc -c < papers/STATE.md) -eq 1005407
          printf '%s  %s\n' 'a7fe14185d7757a7f6a0ad21f4abe7ef' 'papers/STATE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33en)"
          git push
          git rm -r state-33en-parts
          git commit -m "Remove state-33en-parts (batch 33en)"
          git push
