name: Assemble papers/STATE.md (batch 33ed)
on:
  push:
    paths:
      - 'state-parts/**'
concurrency:
  group: assemble-state-parts-33ed
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          all_present=1
          for f in state-parts/p1 state-parts/p2; do
            if [ ! -f "$f" ]; then
              all_present=0
            fi
          done
          if [ "$all_present" = "0" ]; then
            exit 0
          fi
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          test "$(wc -c < papers/STATE.md)" -eq 984732
          printf '%s  %s\n' '141077dbca16f3f6b9eb4565fae7d494' 'papers/STATE.md' | md5sum -c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/STATE.md
          git commit -m 'Assemble papers/STATE.md (batch 33ed)'
          git push
          git rm -r state-parts
          git commit -m 'Remove state-parts (batch 33ed)'
          git push
