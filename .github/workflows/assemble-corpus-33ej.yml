name: Assemble papers/CORPUS.md (batch 33ej)
on:
  push:
    paths:
      - 'corpus-33ej-parts/**'
concurrency:
  group: corpus-33ej-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          N=$(ls corpus-33ej-parts | wc -l)
          if [ "$N" -ne 2 ]; then echo "parts incomplete: $N"; exit 0; fi
          cat corpus-33ej-parts/p1.txt corpus-33ej-parts/p2.txt > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1125541
          printf '%s  %s\n' 'cf1bb66eafd404e7d05ab52ffb7bb85a' 'papers/CORPUS.md' | md5sum -c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33ej)"
          git push
          git rm -r corpus-33ej-parts
          git commit -m "Remove corpus-33ej-parts (batch 33ej)"
          git push
