name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33eh)
on:
  push:
    paths:
      - 'knowledge-33eh-parts/**'
concurrency:
  group: assemble-knowledge-33eh
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          n=$(ls knowledge-33eh-parts/p1.part knowledge-33eh-parts/p2.part knowledge-33eh-parts/p3.part knowledge-33eh-parts/p4.part knowledge-33eh-parts/p5.part knowledge-33eh-parts/p6.part knowledge-33eh-parts/p7.part 2>/dev/null | wc -l)
          if [ "$n" -ne 7 ]; then echo "incomplete"; exit 0; fi
      - name: assemble
        run: |
          cat knowledge-33eh-parts/p1.part knowledge-33eh-parts/p2.part knowledge-33eh-parts/p3.part knowledge-33eh-parts/p4.part knowledge-33eh-parts/p5.part knowledge-33eh-parts/p6.part knowledge-33eh-parts/p7.part > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test "$(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md)" -eq "738061"
          printf '%s  %s\n' '8aeb79c02552b47a676eadec141eb223' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m 'Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33eh)'
          git push
          git rm -r knowledge-33eh-parts
          git commit -m 'Remove knowledge-33eh-parts (batch 33eh)'
          git push
