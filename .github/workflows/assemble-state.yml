name: Assemble papers/STATE.md (batch 33ec)
on:
  push:
    paths:
      - 'state-parts/**'
concurrency:
  group: assemble-state-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and commit
        run: |
          for f in state-parts/p1 state-parts/p2; do
            if [ ! -f "$f" ]; then exit 0; fi
          done
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          [ "$(wc -c < papers/STATE.md)" -eq 981067 ] || { echo SIZE-MISMATCH; exit 1; }
          printf '%s  %s\n' '77ccb4f30e4aaafddf46d851f734c8e4' 'papers/STATE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33ec)"
          git push origin HEAD:main
          git rm -r state-parts
          git commit -m "Remove state-parts (batch 33ec)"
          git pull --rebase origin main
          git push origin HEAD:main
