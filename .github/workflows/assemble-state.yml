name: Assemble STATE (33dr)
on:
  push:
    paths:
      - 'state-parts/**'
concurrency:
  group: assemble-state-33dr
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: All parts present
        run: |
          if [ ! -f state-parts/p1 ] || [ ! -f state-parts/p2 ]; then echo "state-parts incomplete - nothing to assemble"; exit 0; fi
      - name: Assemble and assert
        run: |
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          echo "4b77c71ae8cc10a3a9c088fa545164d1  papers/STATE.md" | md5sum -c -
          [ "$(wc -c < papers/STATE.md)" = "930472" ] || { echo "wc -c mismatch"; exit 1; }
      - name: Commit and clean parts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/STATE.md
          git rm -r state-parts
          git commit -m "batch-33dr: STATE — the 33dr DONE line (the Aspirin series gathered), State 918502 -> 930472"
          git push
