name: Assemble papers/STATE.md (batch 33eb)
on:
  push:
    paths:
      - 'state-parts/**'
concurrency:
  group: assemble-state-33eb
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check parts
        run: |
          ok=1
          for f in state-parts/p1 state-parts/p2; do
            if [ ! -f "$f" ]; then ok=0; fi
          done
          if [ "$ok" -eq 0 ]; then echo "parts missing, exiting"; exit 0; fi
      - name: Assemble
        run: |
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          test "$(wc -c < papers/STATE.md)" -eq 976348
          printf '%s  %s\n' 'a3e84be2475be8c4b7bf4874861a1557' 'papers/STATE.md' | md5sum -c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33eb)"
          git push
          git rm -r state-parts
          git commit -m "Remove state-parts (batch 33eb)"
          git push
