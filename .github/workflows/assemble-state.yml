name: Assemble STATE (batch 33ea)
on:
  push:
    paths:
      - 'state-parts/**'
concurrency:
  group: assemble-state-33ea
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check all parts present
        run: |
          ok=1
          if [ ! -f "state-parts/p1" ]; then
            echo "missing state-parts/p1"
            ok=0
          fi
          if [ ! -f "state-parts/p2" ]; then
            echo "missing state-parts/p2"
            ok=0
          fi
          if [ "$ok" -eq 0 ]; then
            exit 0
          fi
      - name: Assemble and verify
        run: |
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          test "$(wc -c < papers/STATE.md)" -eq 970264
          printf '%s  %s\n' '887c153b4444ca830a269ebad2b22714' 'papers/STATE.md' | md5sum -c
      - name: Commit and clean
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33ea)"
          git push
          git rm -r state-parts
          git commit -m "Remove state-parts (batch 33ea)"
          git push
