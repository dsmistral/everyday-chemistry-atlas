name: Assemble STATE
on:
  push:
    paths:
      - 'state-parts/**'
permissions:
  contents: write
concurrency:
  group: assemble-state
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble, verify, commit
        run: |
          if [ ! -f state-parts/p1 ] || [ ! -f state-parts/p2 ]; then echo "parts not all present; skipping"; exit 0; fi
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          test "$(wc -c < papers/STATE.md)" -eq 961645
          printf '%s  %s\n' '73ffba1572f83d4ea908ba0abc7d9411' 'papers/STATE.md' | md5sum -c -
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/STATE.md
          git rm -r state-parts
          git commit -m "batch-33dy: STATE assembly — the 33dy DONE line at 88 (the grid-figured tranche N469-N474), 961645 B, md5 73ffba1572f83d4ea908ba0abc7d9411"
          git push
