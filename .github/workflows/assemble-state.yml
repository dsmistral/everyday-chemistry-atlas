name: assemble-state-33dw
on:
  push:
    branches: [main]
    paths:
      - 'state-parts/**'
concurrency:
  group: assemble-state-33dw
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble papers/STATE.md
        run: |
          set -e
          for p in state-parts/p1 state-parts/p2; do
            if [ ! -f "$p" ]; then echo "waiting: $p absent"; exit 0; fi
          done
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          echo "assembled: $(wc -c < papers/STATE.md) bytes"
          [ "$(wc -c < papers/STATE.md)" = "948214" ] || { echo "SIZE MISMATCH"; exit 1; }
          printf '%s  %s\n' "71e9909133e733569f89e4f8b579248c" "papers/STATE.md" > /tmp/check.md5
          md5sum -c /tmp/check.md5 || { echo "MD5 MISMATCH"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/STATE.md
          git rm -r -q state-parts
          git commit -m "batch-33dw: STATE — the 33dw line (the queue-pressure resolution: the stale-list correction + the six exits + the dual-format corpus datum), Corpus 465"
          git push
