name: assemble-state-33ds
on:
  push:
    branches: [main]
    paths:
      - 'state-parts/**'
concurrency:
  group: assemble-state-33ds
  cancel-in-progress: false
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble papers/STATE.md
        run: |
          set -e
          for p in state-parts/p1 state-parts/p2; do
            if [ ! -f "$p" ]; then echo "waiting: $p absent"; exit 0; fi
          done
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          echo "assembled: $(wc -c < papers/STATE.md) bytes"
          [ "$(wc -c < papers/STATE.md)" = "933537" ] || { echo "SIZE MISMATCH"; exit 1; }
          printf '%s  %s\n' "cdffc1be0196c55afd589604226f7313" "papers/STATE.md" > /tmp/state.md5
          md5sum -c /tmp/state.md5 || { echo "MD5 MISMATCH"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/STATE.md
          git rm -r -q state-parts
          git commit -m "batch-33ds: STATE — the 33ds DONE line (the bonus-pin five gathered; the register's first private-video class + the OrgSyn/wikiHow credit firsts), Corpus 454 -> 459"
          git push
