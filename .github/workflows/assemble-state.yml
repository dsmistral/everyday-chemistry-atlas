name: Assemble STATE (batch 33dz)
on:
  push:
    paths:
      - 'state-parts/**'
concurrency:
  group: batch-33dz-state-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        run: |
          ok=1
            if [ ! -f "state-parts/p1" ]; then
              ok=0
            fi
            if [ ! -f "state-parts/p2" ]; then
              ok=0
            fi
          if [ "$ok" -ne 1 ]; then
            echo "parts missing - exit 0 (guard)"
            exit 0
          fi
          cat state-parts/p1 state-parts/p2 > papers/STATE.md
          if [ "$(wc -c < papers/STATE.md)" -ne 965114 ]; then
            echo "SIZE MISMATCH"
            exit 1
          fi
          printf '%s  %s\n' '0afaf82fb87e271809381dbed59c14e7' 'papers/STATE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers/STATE.md
          git commit -m "batch-33dz: STATE assembly — the 33dz DONE line at 88 (the unfigured-remainder tranche N475-N479), 965114 B, md5 0afaf82fb87e271809381dbed59c14e7"
          git push
          git rm -r state-parts
          git commit -m "batch-33dz: state-parts removed in-job (assembly verified)"
          git push
