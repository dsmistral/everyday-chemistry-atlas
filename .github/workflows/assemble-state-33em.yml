name: Assemble papers/STATE.md (batch 33em)
on:
  push:
    paths:
      - 'state-33em-parts/**'
concurrency:
  group: assemble-state-33em
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls state-33em-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat state-33em-parts/* > papers/STATE.md
          test $(wc -c < papers/STATE.md) -eq 1002674
          printf '%s  %s\n' '12b76c3c922a90a14ec83bb1f08a51b0' 'papers/STATE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33em)"
          git push
          git rm -r state-33em-parts
          git commit -m "Remove state-33em-parts (batch 33em)"
          git push
