name: Assemble papers/STATE.md (batch 33ek)
on:
  push:
    paths:
      - 'state-33ek-parts/**'
concurrency:
  group: assemble-state-33ek
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls state-33ek-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat state-33ek-parts/* > papers/STATE.md
          test $(wc -c < papers/STATE.md) -eq 998994
          printf '%s  %s\n' '6a647b097b212333a9754def340cb642' 'papers/STATE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33ek)"
          git push
          git rm -r state-33ek-parts
          git commit -m "Remove state-33ek-parts (batch 33ek)"
          git push
