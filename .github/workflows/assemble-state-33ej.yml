name: Assemble papers/STATE.md (batch 33ej)
on:
  push:
    paths:
      - 'state-33ej-parts/**'
concurrency:
  group: state-33ej-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          N=$(ls state-33ej-parts | wc -l)
          if [ "$N" -ne 2 ]; then echo "parts incomplete: $N"; exit 0; fi
          cat state-33ej-parts/p1.txt state-33ej-parts/p2.txt > papers/STATE.md
          test $(wc -c < papers/STATE.md) -eq 997345
          printf '%s  %s\n' '84242596b58637e4a180352d4d988e0d' 'papers/STATE.md' | md5sum -c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33ej)"
          git push
          git rm -r state-33ej-parts
          git commit -m "Remove state-33ej-parts (batch 33ej)"
          git push
