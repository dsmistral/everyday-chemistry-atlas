name: Assemble papers/CORPUS.md (batch 33em)
on:
  push:
    paths:
      - 'corpus-33em-parts/**'
concurrency:
  group: assemble-corpus-33em
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls corpus-33em-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat corpus-33em-parts/* > papers/CORPUS.md
          test $(wc -c < papers/CORPUS.md) -eq 1132649
          printf '%s  %s\n' '0a73291e35f3a4cb14bd47349a0a9668' 'papers/CORPUS.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/CORPUS.md
          git commit -m "Assemble papers/CORPUS.md (batch 33em)"
          git push
          git rm -r corpus-33em-parts
          git commit -m "Remove corpus-33em-parts (batch 33em)"
          git push
