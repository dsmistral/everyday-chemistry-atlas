name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33es)
on:
  push:
    paths:
      - 'knowledge-33es-parts/**'
concurrency:
  group: assemble-knowledge-33es
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls knowledge-33es-parts | wc -l)
          if [ "$N" -ne 7 ]; then exit 0; fi
          cat knowledge-33es-parts/* > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) -eq 752021
          printf '%s  %s\n' '86d8f87389a365edb4a8dcc09df4d904' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33es)"
          git push
          git rm -r knowledge-33es-parts
          git commit -m "Remove knowledge-33es-parts (batch 33es)"
          git push
