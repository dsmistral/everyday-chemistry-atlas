name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33eq)
on:
  push:
    paths:
      - 'knowledge-33eq-parts/**'
concurrency:
  group: assemble-knowledge-33eq
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls knowledge-33eq-parts | wc -l)
          if [ "$N" -ne 7 ]; then exit 0; fi
          cat knowledge-33eq-parts/* > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) -eq 750139
          printf '%s  %s\n' 'a34c7f3b9965bb92613a3fc53628f962' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33eq)"
          git push
          git rm -r knowledge-33eq-parts
          git commit -m "Remove knowledge-33eq-parts (batch 33eq)"
          git push
