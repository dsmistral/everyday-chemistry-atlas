name: Assemble papers/STATE.md (batch 33ei)
on:
  push:
    paths:
      - 'state-33ei-parts/**'
concurrency:
  group: state-33ei-parts
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard
        run: |
          N=$(ls state-33ei-parts | wc -l)
          if [ "$N" -ne 2 ]; then echo "parts incomplete: $N"; exit 0; fi
          cat state-33ei-parts/p1.txt state-33ei-parts/p2.txt > papers/STATE.md
          test $(wc -c < papers/STATE.md) -eq 995558
          printf '%s  %s\n' '9a0370e1e75902ce404e29c1443de84a' 'papers/STATE.md' | md5sum -c
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33ei)"
          git push
          git rm -r state-33ei-parts
          git commit -m "Remove state-33ei-parts (batch 33ei)"
          git push
