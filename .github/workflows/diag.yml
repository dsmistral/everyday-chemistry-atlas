name: diag
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: loop-guard
        run: 'if git log -1 --format=%s | grep -q "^\[diag\]"; then echo "diag already run — skip"; exit 0; fi'
      - run: bash register-parts/diag.sh
