name: session-192-close-repair
on:
  push:
    paths:
      - 'repair/**'
      - '.github/workflows/close-repair.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard (repair already closed = nothing to do)
        run: if [ ! -f repair/manifest.md5 ]; then echo "repair dir absent, nothing to do"; exit 0; fi
      - name: verify the full session state (md5sum gate over repo files + spans)
        run: md5sum -c repair/manifest.md5
      - name: apply the repairs (byte + md5 gated, fails rather than writes a bad file)
        run: python3 repair/recipe.py
      - name: commit the close
        run: |
          set -e
          git config user.name "vibe-agent"
          git config user.email "vibe@users.noreply.github.com"
          git rm session-state/ACTIVE-SESSION.md
          git add KNOWLEDGE.md PROJECT.md
          git rm -r -q repair .github/workflows/close-repair.yml
          git commit -m "session 192 close (in-repo verified): PROJECT.md row 192 (the Ch 51 Phase-3 adversarial review record) + the standing to-do ledger ([x] 191 restored, [x] 192 appended, the [ ] 193 queue re-seated) + the Ch 51 map flip drafted to reviewed; KNOWLEDGE.md session-192 paragraph appended; ACTIVE-SESSION deleted at close; the Engine 79 record set deferred with the close (the JustBash file worker outage blocked the tool-results extraction; disclosed in row 192 with digest anchors; owed at the first live-worker session); md5sum -c over the full session state + recipe byte/md5 gates all executed in-repo; PROJECT.md 664,197 B; KNOWLEDGE.md 678,666 B"
          git push
      - name: receipt
        run: |
          git show --stat HEAD | head -20
          echo "KNOWLEDGE.md bytes: $(git show HEAD:KNOWLEDGE.md | wc -c)"
          echo "PROJECT.md bytes: $(git show HEAD:PROJECT.md | wc -c)"
