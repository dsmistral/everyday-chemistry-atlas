name: session-194-close-repair
on:
  push:
    paths:
      - 'repair/**'
      - '.github/workflows/close-repair.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard (repair already closed = nothing to do)
        run: if [ ! -f repair/manifest.md5 ]; then echo "repair dir absent, nothing to do"; exit 0; fi
      - name: verify the full session state (md5sum gate over repo files + spans)
        run: md5sum -c repair/manifest.md5
      - name: apply the repairs (byte + md5 gated, fails rather than writes a bad file)
        run: python3 repair/recipe.py
      - name: commit the close
        run: |
          set -e
          git config user.name "vibe-agent"
          git config user.email "vibe@users.noreply.github.com"
          git rm session-state/ACTIVE-SESSION.md
          git add KNOWLEDGE.md PROJECT.md
          git rm -r -q repair .github/workflows/close-repair.yml
          git commit -m "session 194 close (in-repo verified): PROJECT.md row 194 (Ch 52 The Medicine Shelf part 1 of 2 drafted — the recognition-only fence chapter, the P18 ABSOLUTE discipline held; Engine 80 battery PASS with the honest harness-side history) + [x] 194 appended + the [ ] 195 queue re-seated; KNOWLEDGE.md session-194 paragraph appended; ACTIVE-SESSION deleted at close; the Engine 80 record set landed (the transcripts md5-gated against the frozen receipts; the source lost to the session-194 context compaction, disclosed, no re-key claimed); md5sum -c over the full session state + recipe byte/md5 gates all executed in-repo; PROJECT.md 676536 B; KNOWLEDGE.md 683266 B"
          git push
      - name: receipt
        run: |
          git show --stat HEAD | head -20
          echo "KNOWLEDGE.md bytes: $(git show HEAD:KNOWLEDGE.md | wc -c)"
          echo "PROJECT.md bytes: $(git show HEAD:PROJECT.md | wc -c)"
