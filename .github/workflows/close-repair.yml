name: session-199-close-repair
on:
  push:
    branches: [main]
    paths:
      - 'repair/**'
      - '.github/workflows/close-repair.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard
        run: |
          set -e
          [ -f repair/manifest.md5 ] || { echo "repair/manifest.md5 missing"; exit 1; }
          [ -f repair/recipe.py ] || { echo "repair/recipe.py missing"; exit 1; }
          [ -f PROJECT.md ] || { echo "PROJECT.md missing"; exit 1; }
          [ -f KNOWLEDGE.md ] || { echo "KNOWLEDGE.md missing"; exit 1; }
      - name: Verify every repair input (md5sum -c)
        run: md5sum -c repair/manifest.md5
      - name: Run the close recipe (byte/md5 gated; fails rather than writes)
        run: python3 repair/recipe.py
      - name: Commit the session-199 close
        run: |
          set -e
          git config user.name vibe-agent
          git config user.email vibe@users.noreply.github.com
          git add PROJECT.md KNOWLEDGE.md
          git rm -q session-state/ACTIVE-SESSION.md
          git rm -rq repair
          git rm -q .github/workflows/close-repair.yml
          git commit -m "session-199 close: Vol VIII Ch 54 'The Product Deconstructions' drafted (single part, 51,573 B) — E84-IR interval-engine battery PASS (probe 2/2, molar 8/8, balance rev-3 8/8 with two harness defects disclosed, dose/economics 18/18, injections 4/4, determinism byte-identical; the ~7% superfat the derived datum), engine records pushed, web edition oracle-first at 45,764 B (ch53 reproduced byte-identically before the render), map flip Ch 54 planned->drafted (no citation correction), row 199 landed, x-ledger appended, queue re-seated to session 200 = Vol IX Ch 55 Cryogens, KNOWLEDGE.md session-199 paragraph appended (PROJECT.md 712,869 B, KNOWLEDGE.md 695,195 B), ACTIVE-SESSION.md and the repair scaffolding deleted"
          git push
