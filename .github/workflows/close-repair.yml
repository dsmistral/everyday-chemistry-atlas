name: session-193-close-repair
on:
  push:
    paths:
      - 'repair/**'
      - '.github/workflows/close-repair.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard (repair already closed = nothing to do)
        run: if [ ! -f repair/manifest.md5 ]; then echo "repair dir absent, nothing to do"; exit 0; fi
      - name: verify the full session state (md5sum gate over repo files + spans)
        run: md5sum -c repair/manifest.md5
      - name: apply the repairs (byte + md5 gated, fails rather than writes a bad file)
        run: python3 repair/recipe.py
      - name: commit the close
        run: |
          set -e
          git config user.name "vibe-agent"
          git config user.email "vibe@users.noreply.github.com"
          git rm session-state/ACTIVE-SESSION.md
          git add KNOWLEDGE.md PROJECT.md
          git rm -r -q repair .github/workflows/close-repair.yml
          git commit -m "session 193 close (in-repo verified): PROJECT.md row 193 (the E79 record-set debt paid + the Ch 52-56 authoring call; THE USER CALLED CH 52 THE MEDICINE SHELF) + [x] 193 appended + the [ ] 194 queue re-seated; KNOWLEDGE.md session-193 paragraph appended; ACTIVE-SESSION deleted at close; the Engine 79 record set landed this session with the honest transcripts-loss disclosure (the tool-results rotation; the step log from git @ a5c05872 frozen as the record); md5sum -c over the full session state + recipe byte/md5 gates all executed in-repo; PROJECT.md 669488 B; KNOWLEDGE.md 680575 B"
          git push
      - name: receipt
        run: |
          git show --stat HEAD | head -20
          echo "KNOWLEDGE.md bytes: $(git show HEAD:KNOWLEDGE.md | wc -c)"
          echo "PROJECT.md bytes: $(git show HEAD:PROJECT.md | wc -c)"