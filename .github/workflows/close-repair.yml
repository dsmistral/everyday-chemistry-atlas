name: session-196-close-repair
on:
  push:
    paths:
      - 'repair/**'
      - '.github/workflows/close-repair.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard (repair already closed = nothing to do)
        run: if [ ! -f repair/manifest.md5 ]; then echo "repair dir absent, nothing to do"; exit 0; fi
      - name: verify the full session state (md5sum gate over repo files + spans)
        run: md5sum -c repair/manifest.md5
      - name: apply the repairs (byte + md5 gated, fails rather than writes a bad file)
        run: python3 repair/recipe.py
      - name: commit the close
        run: |
          set -e
          git config user.name "vibe-agent"
          git config user.email "vibe@users.noreply.github.com"
          git rm session-state/ACTIVE-SESSION.md
          git add KNOWLEDGE.md PROJECT.md
          git rm -r -q repair .github/workflows/close-repair.yml
          git commit -m "session 196 close (in-repo verified): PROJECT.md row 196 (Ch 52 The Medicine Shelf reviewed — the Phase-3 adversarial review PASS WITH CORRECTIONS: Engine 82-RD the rational-display engine, RA-1 the exact-basis miss 125.25 to 125.26, RA-2 the 9.28 truncation to 9.29, RA-3 the Daraprim percent annotated (exact 5,456); zero frozen-figure chemistry moved; the honest harness history disclosed; the review split at the context boundary — part 2 = the web edition oracle-first + the banner reviewed + the map flip reviewed, owed next session) + [x] 196 appended + the [ ] 197 queue re-seated; KNOWLEDGE.md session-196 paragraph appended; ACTIVE-SESSION deleted at close; md5sum -c over the full session state + recipe byte/md5 gates all executed in-repo; PROJECT.md 693172 B; KNOWLEDGE.md 689610 B"
          git push
      - name: receipt
        run: |
          git show --stat HEAD | head -20
          echo "KNOWLEDGE.md bytes: $(git show HEAD:KNOWLEDGE.md | wc -c)"
          echo "PROJECT.md bytes: $(git show HEAD:PROJECT.md | wc -c)"
