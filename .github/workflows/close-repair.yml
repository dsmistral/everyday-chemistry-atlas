name: session-207-close-repair
on:
  push:
    branches: [main]
    paths: ['repair/**', '.github/workflows/close-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard
        id: guard
        run: |
          if grep -q '^| 207 |' PROJECT.md || [ ! -f repair/manifest.md5 ] || [ ! -f repair/recipe.py ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify inputs
        if: steps.guard.outputs.skip == 'false'
        run: md5sum -c repair/manifest.md5
      - name: Apply close
        if: steps.guard.outputs.skip == 'false'
        run: python3 repair/recipe.py
      - name: Commit close
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name vibe-agent
          git config user.email vibe@users.noreply.github.com
          git rm session-state/ACTIVE-SESSION.md
          git rm -r repair
          git rm .github/workflows/close-repair.yml
          git add PROJECT.md KNOWLEDGE.md
          git commit -m "Session 207 close: the Ch 54 review applied (the in-repo Actions route)"
          git push
