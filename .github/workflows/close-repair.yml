name: session-200-close-repair
on:
  push:
    branches: [main]
    paths: ['repair/**', '.github/workflows/close-repair.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard against re-trigger
        run: |
          if grep -q '^| 200 |' PROJECT.md; then
            echo "Close already applied — nothing to do."
            exit 0
          fi
      - name: Verify inputs
        run: md5sum -c repair/manifest.md5
      - name: Apply the close
        run: python3 repair/recipe.py
      - name: Commit
        run: |
          git config user.name "vibe-agent"
          git config user.email "vibe@users.noreply.github.com"
          git rm session-state/ACTIVE-SESSION.md
          git rm -r repair
          git rm .github/workflows/close-repair.yml
          git add PROJECT.md KNOWLEDGE.md
          git commit -m "Session 200 close: Ch 55 row/x/queue/map/KNOWLEDGE applied (the in-repo Actions route)"
          git push
