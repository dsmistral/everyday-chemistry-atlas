name: session-197-close-repair
on:
  push:
    paths:
      - 'repair/**'
      - '.github/workflows/close-repair.yml'
permissions:
  contents: write
jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard (repair already closed = nothing to do)
        run: if [ ! -f repair/manifest.md5 ]; then echo "repair dir absent, nothing to do"; exit 0; fi
      - name: verify the full session state (md5sum gate over repo files + spans)
        run: md5sum -c repair/manifest.md5
      - name: apply the repairs (byte + md5 gated, fails rather than writes a bad file)
        run: python3 repair/recipe.py
      - name: commit the close
        run: |
          set -e
          git config user.name "vibe-agent"
          git config user.email "vibe@users.noreply.github.com"
          git rm session-state/ACTIVE-SESSION.md
          git add KNOWLEDGE.md PROJECT.md
          git rm -r -q repair .github/workflows/close-repair.yml
          git commit -m "session 197 close (in-repo verified): PROJECT.md row 197 (Ch 52 The Medicine Shelf review part 2 — the reviewed web edition rendered oracle-first, the renderer reproducing the shipped drafted edition byte-identically (bce84ec5) before the render; web/ch52-web.html 78,883 B dc04087c, three routes converging; the map line flipped \`drafted\`->\`reviewed\` — the chapter's full pipeline complete: 194/195 drafted, 196 the review battery PASS WITH CORRECTIONS, 197 the reviewed edition) + [x] 197 appended + the [ ] 198 queue re-seated (Vol VIII Ch 53 Citric, Starch, and Vanillin, or whatever the user calls instead); KNOWLEDGE.md session-197 paragraph appended; ACTIVE-SESSION deleted at close; md5sum -c over the full session state + recipe byte/md5 gates all executed in-repo; PROJECT.md 697494 B; KNOWLEDGE.md 691545 B"
          git push
      - name: receipt
        run: |
          git show --stat HEAD | head -20
          echo "KNOWLEDGE.md bytes: $(git show HEAD:KNOWLEDGE.md | wc -c)"
          echo "PROJECT.md bytes: $(git show HEAD:PROJECT.md | wc -c)"
