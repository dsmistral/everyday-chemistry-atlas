name: Assemble SURVEY-2.md both mirrors (33et)
on:
  push:
    branches: [main]
    paths:
      - 'survey2-33et-parts/**'
concurrency:
  group: assemble-survey2-33et
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify
        run: |
          test -f survey2-33et-parts/p1
          test -f survey2-33et-parts/p2
          cat survey2-33et-parts/p1 survey2-33et-parts/p2 > /tmp/SURVEY-2.md
          test "$(wc -c < /tmp/SURVEY-2.md)" -eq 662294
          echo "f04414099ff408d796812cd47c987111  /tmp/SURVEY-2.md" | md5sum -c -
          cp /tmp/SURVEY-2.md papers/SURVEY-2.md
          cp /tmp/SURVEY-2.md knowledge/everyday-chem-survey/SURVEY-2.md
      - name: Commit and clean
        run: |
          git config user.name "survey-assembly"
          git config user.email "survey-assembly@users.noreply.github.com"
          git add papers/SURVEY-2.md knowledge/everyday-chem-survey/SURVEY-2.md
          if git diff --staged --quiet; then echo "no changes"; else
            git commit -m "Assemble SURVEY-2.md both mirrors (batch 33et, byte-gated 662294 B / f04414099ff408d796812cd47c987111)"
          fi
          git rm -r -q survey2-33et-parts
          if git diff --staged --quiet; then echo "no parts to remove"; else
            git commit -m "Remove survey2-33et-parts (batch 33et)"
          fi
          git push
