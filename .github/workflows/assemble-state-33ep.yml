name: Assemble papers/STATE.md (batch 33ep)
on:
  push:
    paths:
      - 'state-33ep-parts/**'
concurrency:
  group: assemble-state-33ep
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls state-33ep-parts | wc -l)
          if [ "$N" -ne 2 ]; then exit 0; fi
          cat state-33ep-parts/* > papers/STATE.md
          test $(wc -c < papers/STATE.md) -eq 1009858
          printf '%s  %s\n' '18fdd5905fdcfb9733bf99d896015bdd' 'papers/STATE.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add papers/STATE.md
          git commit -m "Assemble papers/STATE.md (batch 33ep)"
          git push
          git rm -r state-33ep-parts
          git commit -m "Remove state-33ep-parts (batch 33ep)"
          git push
