name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33em)
on:
  push:
    paths:
      - 'knowledge-33em-parts/**'
concurrency:
  group: assemble-knowledge-33em
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls knowledge-33em-parts | wc -l)
          if [ "$N" -ne 7 ]; then exit 0; fi
          cat knowledge-33em-parts/* > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) -eq 744938
          printf '%s  %s\n' 'bab9681a6e9696dbd5e787c78c17f607' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33em)"
          git push
          git rm -r knowledge-33em-parts
          git commit -m "Remove knowledge-33em-parts (batch 33em)"
          git push
