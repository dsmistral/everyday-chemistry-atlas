name: Assemble papers/CORPUS.md (batch 33ed)
on:
  push:
    paths:
      - 'corpus-parts/**'
concurrency:
  group: assemble-corpus-parts-33ed
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble
        run: |
          all_present=1
          for f in corpus-parts/p1 corpus-parts/p2; do
            if [ ! -f "$f" ]; then
              all_present=0
            fi
          done
          if [ "$all_present" = "0" ]; then
            exit 0
          fi
          cat corpus-parts/p1 corpus-parts/p2 > papers/CORPUS.md
          test "$(wc -c < papers/CORPUS.md)" -eq 1093154
          printf '%s  %s\n' '5d684a9af68349a75d21a92dbeeada91' 'papers/CORPUS.md' | md5sum -c
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add papers/CORPUS.md
          git commit -m 'Assemble papers/CORPUS.md (batch 33ed)'
          git push
          git rm -r corpus-parts
          git commit -m 'Remove corpus-parts (batch 33ed)'
          git push
