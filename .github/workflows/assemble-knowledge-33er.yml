name: Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33er)
on:
  push:
    paths:
      - 'knowledge-33er-parts/**'
concurrency:
  group: assemble-knowledge-33er
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assemble
        run: |
          N=$(ls knowledge-33er-parts | wc -l)
          if [ "$N" -ne 7 ]; then exit 0; fi
          cat knowledge-33er-parts/* > knowledge/everyday-chem-survey/KNOWLEDGE.md
          test $(wc -c < knowledge/everyday-chem-survey/KNOWLEDGE.md) -eq 751182
          printf '%s  %s\n' 'f5bf0c371274bc760e6fd7d3dbc257e8' 'knowledge/everyday-chem-survey/KNOWLEDGE.md' | md5sum -c
          git config user.name "assembly-bot"
          git config user.email "assembly-bot@users.noreply.github.com"
          git add knowledge/everyday-chem-survey/KNOWLEDGE.md
          git commit -m "Assemble knowledge/everyday-chem-survey/KNOWLEDGE.md (batch 33er)"
          git push
          git rm -r knowledge-33er-parts
          git commit -m "Remove knowledge-33er-parts (batch 33er)"
          git push
